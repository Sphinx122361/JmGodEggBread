<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Order EggyBite | JM God Egg Bread</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body class="order-page">

    <main class="order-box">

        <h1>Order EggyBite</h1>

        <p class="order-intro">
            Original EggyBite – ₱15 each<br>
            CheggyBitee – ₱17 each
        </p>

        <form id="orderForm">

            <label for="customerName">Your Name</label>
            <input
                type="text"
                id="customerName"
                name="customerName"
                placeholder="Your Name"
                autocomplete="name"
                maxlength="100"
                required
            >

            <label for="originalQuantity">Original EggyBite (₱15)</label>
            <input
                type="number"
                id="originalQuantity"
                name="originalQuantity"
                placeholder="Quantity"
                min="0"
                step="1"
                inputmode="numeric"
                value="0"
                required
            >

            <label for="cheggyQuantity">CheggyBitee (₱17)</label>
            <input
                type="number"
                id="cheggyQuantity"
                name="cheggyQuantity"
                placeholder="Quantity"
                min="0"
                step="1"
                inputmode="numeric"
                value="0"
                required
            >

            <label for="orderDetails">
                Pickup Location or Instructions
            </label>

            <input
                type="text"
                id="orderDetails"
                name="orderDetails"
                placeholder="Pickup Location or Instructions"
                maxlength="300"
                required
            >

            <button
                type="submit"
                class="order-btn"
                id="orderButton"
            >
                Order Us
            </button>

        </form>

        <p id="orderMessage" role="status" aria-live="polite"></p>

        <a href="index.html" class="back-button">
            ← Back to Home
        </a>

    </main>

</body>
</html>
