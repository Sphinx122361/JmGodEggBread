<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order EggyBite | JM God Egg Bread</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body class="order-page">

    <main class="order-box">

        <h1>Order EggyBite</h1>

        <p class="order-intro">
            Enjoy our delicious EggyBite for only ₱15 each!
        </p>

        <form id="orderForm">

            <label for="customerName">Your name</label>
            <input
                type="text"
                id="customerName"
                name="customerName"
                placeholder="Your Name"
                autocomplete="name"
                required
            >

            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                placeholder="Quantity"
                min="1"
                step="1"
                inputmode="numeric"
                required
            >

            <label for="orderDetails">Pickup location or instructions</label>
            <input
                type="text"
                id="orderDetails"
                name="orderDetails"
                placeholder="Pickup Location or Instructions"
                required
            >

            <label for="paymentMethod">Payment Method</label>

            <select id="paymentMethod" name="paymentMethod" required>
                <option value="" disabled selected>
                    Select Payment Method
                </option>

                <option value="GCash Demo">GCash</option>
                <option value="Cash on Pickup">Cash on Delivery</option>
            </select>

            <button type="submit" class="order-btn" id="orderButton">
                Order Us
            </button>

        </form>

        <p id="orderMessage" role="status" aria-live="polite"></p>

        <div id="orderSummary" class="order-summary" hidden></div>

        <button type="button" id="copyOrder" class="copy-order-btn" hidden>
            Copy Order Details
        </button>

        

        <a href="index.html" class="back-button">
            ← Back to Home
        </a>

    </main>

    <div id="gcashPayment" class="gcash-modal" hidden>

        <div class="gcash-modal-content">

            <button
                type="button"
                id="closeGcash"
                class="gcash-close"
                aria-label="Close payment popup"
            >
                ×
            </button>

            <div class="gcash-header">
                <h2>GCash Payment</h2>
            </div>

            <div class="gcash-details">

                <h3>JM God Egg Bread</h3>

                <p>Amount to Pay</p>

                <h2 id="gcashAmount">₱0.00</h2>

            </div>



            <button
                type="button"
                id="confirmPayment"
                class="gcash-confirm-btn"
            >
                Confirm Payment
            </button>

            <p id="paymentStatus" role="status"></p>

        </div>

    </div>

</body>
</html>
